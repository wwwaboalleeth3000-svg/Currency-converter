<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>محول الليرة السورية</title>
  <style>
    body {
      font-family: Tahoma;
      direction: rtl;
      margin: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .day { background: #fdfdfd; color: #222; }
    .night { background: #1e1e1e; color: #eee; }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .section {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      width: 250px;
    }

    input {
      padding: 8px;
      margin: 5px 0;
      width: 150px;
      font-size: 16px;
      border-radius: 5px;
    }

    label {
      font-size: 16px;
      display: block;
      margin-top: 8px;
    }

    button {
      padding: 8px 15px;
      font-size: 14px;
      cursor: pointer;
    }

    /* ألوان الفئات الجديدة */
    #new500 { background-color: #f5c6cb; }
    #new200 { background-color: #e0ccff; }
    #new100 { background-color: #ffe5b4; }
    #new50 { background-color: #fff3cd; }
    #new25 { background-color: #cce5ff; }
    #new10 { background-color: #d4edda; }

    /* ألوان الفئات القديمة */
    #old5000 { background-color: #f8d7da; }
    #old2000 { background-color: #f5c6cb; }
    #old1000 { background-color: #e0ccff; }
    #old500 { background-color: #ffe5b4; }
    #old200 { background-color: #fff3cd; }
    #old100 { background-color: #cce5ff; }
    #old50 { background-color: #d4edda; }
  </style>
</head>
<body>
  <!-- زر تبديل الوضع بالزاوية -->
  <div class="top-bar">
    <button onclick="toggleMode()">تبديل الوضع 🌗</button>
  </div>

  <h1>💰 تطبيق محول الليرة السورية</h1>

  <!-- الفئات + الإدخال المباشر جنب بعض -->
  <div class="container">
    <div class="section">
      <h2>الفئات القديمة</h2>
      <label>5000:</label><input type="number" id="old5000" value="0" oninput="calculateTotal()">
      <label>2000:</label><input type="number" id="old2000" value="0" oninput="calculateTotal()">
      <label>1000:</label><input type="number" id="old1000" value="0" oninput="calculateTotal()">
      <label>500:</label><input type="number" id="old500" value="0" oninput="calculateTotal()">
      <label>200:</label><input type="number" id="old200" value="0" oninput="calculateTotal()">
      <label>100:</label><input type="number" id="old100" value="0" oninput="calculateTotal()">
      <label>50:</label><input type="number" id="old50" value="0" oninput="calculateTotal()">
    </div>

    <div class="section">
      <h2>الفئات الجديدة</h2>
      <label>500:</label><input type="number" id="new500" value="0" oninput="calculateTotal()">
      <label>200:</label><input type="number" id="new200" value="0" oninput="calculateTotal()">
      <label>100:</label><input type="number" id="new100" value="0" oninput="calculateTotal()">
      <label>50:</label><input type="number" id="new50" value="0" oninput="calculateTotal()">
      <label>25:</label><input type="number" id="new25" value="0" oninput="calculateTotal()">
      <label>10:</label><input type="number" id="new10" value="0" oninput="calculateTotal()">
    </div>

    <div class="section">
      <h2>إدخال مباشر</h2>
      <label>المبلغ بالليرة القديمة:</label>
      <input type="number" id="oldInput" oninput="convertToNew();calculateTotal();">
      <label>المبلغ بالليرة الجديدة:</label>
      <input type="number" id="newInput" oninput="convertToOld();calculateTotal();">
    </div>
  </div>

  <!-- النتائج تحت الكل -->
  <div class="section" style="margin:20px auto; width:300px;">
    <h2>النتائج</h2>
    <p id="totalOld">المجموع بالليرة القديمة: 0</p>
    <p id="totalNew">المجموع بالليرة الجديدة: 0</p>
    <p id="remaining">المبلغ المتبقي: 0 قديمة / 0 جديدة</p>
    <button onclick="resetAll()">تصفير الإدخالات</button>
  </div>

  <script>
    function convertToNew() {
      let oldVal = document.getElementById("oldInput").value;
      document.getElementById("newInput").value = oldVal ? oldVal / 100 : "";
    }
    function convertToOld() {
      let newVal = document.getElementById("newInput").value;
      document.getElementById("oldInput").value = newVal ? newVal * 100 : "";
    }

    function calculateTotal() {
      // الفئات الجديدة
      let new10 = parseInt(document.getElementById("new10").value) * 10 || 0;
      let new25 = parseInt(document.getElementById("new25").value) * 25 || 0;
      let new50 = parseInt(document.getElementById("new50").value) * 50 || 0;
      let new100 = parseInt(document.getElementById("new100").value) * 100 || 0;
      let new200 = parseInt(document.getElementById("new200").value) * 200 || 0;
      let new500 = parseInt(document.getElementById("new500").value) * 500 || 0;

      // الفئات القديمة
      let old50 = parseInt(document.getElementById("old50").value) * 50 || 0;
      let old100 = parseInt(document.getElementById("old100").value) * 100 || 0;
      let old200 = parseInt(document.getElementById("old200").value) * 200 || 0;
      let old500 = parseInt(document.getElementById("old500").value) * 500 || 0;
      let old1000 = parseInt(document.getElementById("old1000").value) * 1000 || 0;
      let old2000 = parseInt(document.getElementById("old2000").value) * 2000 || 0;
      let old5000 = parseInt(document.getElementById("old5000").value) * 5000 || 0;

      let totalNew = new10 + new25 + new50 + new100 + new200 + new500 +
                     (old50+old100+old200+old500+old1000+old2000+old5000)/100;
      let totalOld = old50+old100+old200+old500+old1000+old2000+old5000 +
                     (new10+new25+new50+new100+new200+new500)*100;

      document.getElementById("totalOld").innerText = "المجموع بالليرة القديمة: " + totalOld.toLocaleString();
        document.getElementById("totalNew").innerText = "المجموع بالليرة الجديدة: " + totalNew.toLocaleString();

      let oldInput = parseInt(document.getElementById("oldInput").value) || 0;
      let newInput = parseInt(document.getElementById("newInput").value) || 0;

      let remainingOld = oldInput - totalOld;
      let remainingNew = newInput - totalNew;

      document.getElementById("remaining").innerText =
  "المبلغ المتبقي: " + remainingOld.toLocaleString() + " قديمة / " + remainingNew.toLocaleString() + " جديدة";

    }

    function resetAll() {
      document.querySelectorAll("input").forEach(el => el.value = 0);
      document.getElementById("oldInput").value = "";
      document.getElementById("newInput").value = "";
      document.getElementById("totalOld").innerText = "المجموع بالليرة القديمة: 0";
      document.getElementById("totalNew").innerText = "المجموع بالليرة الجديدة: 0";
      document.getElementById("remaining").innerText = "المبلغ المتبقي: 0 قديمة / 0 جديدة";
    }

    function toggleMode() {
      let body = document.body;
      if (body.classList.contains("day")) {
        body.classList.remove("day"); 
        body.classList.add("night");
        localStorage.setItem("mode", "night");
      } else {
        body.classList.remove("night"); 
        body.classList.add("day");
        localStorage.setItem("mode", "day");
      }
    }

    function detectSystemMode() {
      let savedMode = localStorage.getItem("mode");
      if (savedMode) {
        document.body.classList.add(savedMode);
      } else {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.body.classList.add("night");
        } else {
          document.body.classList.add("day");
        }
      }
    }

    // تشغيل عند تحميل الصفحة
    detectSystemMode();
  </script>
</body>
</html>
